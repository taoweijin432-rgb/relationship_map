server {
    listen 8088;
    server_name _;
    root /srv/relationship-map/frontend/dist-http-save-v1;
    index index.html;

    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        alias /srv/relationship-map/infra/nginx/maintenance.html;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
    }

    location @api_maintenance {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"MAINTENANCE","message":"系统正在进行夜间数据更新，请稍后重试"}';
    }

    location /api/ {
        error_page 503 = @api_maintenance;
        if (-f /etc/relationship-map/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location / {
        if (-f /etc/relationship-map/maintenance.flag) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}
