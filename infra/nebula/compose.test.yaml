# Ubuntu x86_64测试服务器配置；与本机实验模板分别维护。
name: relationship-nebula-test

x-common: &common
  platform: linux/amd64
  restart: unless-stopped
  networks: [lab]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  metad:
    <<: *common
    image: vesoft/nebula-metad:v3.8.0
    mem_limit: 512m
    cpus: 0.5
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=0.0.0.0
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=1
    volumes:
      - meta-data:/data/meta
      - meta-logs:/logs
    healthcheck:
      test: [CMD, curl, -sf, http://127.0.0.1:19559/status]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  storaged:
    <<: *common
    image: vesoft/nebula-storaged:v3.8.0
    mem_limit: 2g
    cpus: 2
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=0.0.0.0
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --rocksdb_block_cache=128
      - --v=0
      - --minloglevel=1
    depends_on:
      metad:
        condition: service_healthy
    volumes:
      - storage-data:/data/storage
      - storage-logs:/logs
    healthcheck:
      test: [CMD, curl, -sf, http://127.0.0.1:19779/status]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

  graphd:
    <<: *common
    image: vesoft/nebula-graphd:v3.8.0
    mem_limit: 10g
    cpus: 4
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=0.0.0.0
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --enable_authorize=true
      - --v=0
      - --minloglevel=1
    ports:
      - 127.0.0.1:19669:9669
    depends_on:
      storaged:
        # Storage 首次启动需经 Graph 执行 ADD HOSTS，不能等待注册后的健康态。
        condition: service_started
    volumes:
      - graph-logs:/logs
    healthcheck:
      test: [CMD, curl, -sf, http://127.0.0.1:19669/status]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

networks:
  lab:
    driver: bridge

volumes:
  meta-data:
  meta-logs:
  storage-data:
  storage-logs:
  graph-logs:
